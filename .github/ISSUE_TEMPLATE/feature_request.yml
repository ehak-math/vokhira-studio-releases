name: Feature Request
description: Suggest an idea or enhancement for Vokhira Studio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement! Please describe your workflow idea and how it would improve the Vokhira Studio experience.

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature or capability you would like to see.
      placeholder: "Add batch export presets for 9:16 vertical video shorts..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Workflow Context
      description: Describe the scenario or problem you are trying to solve and how this feature fits your workflow.
      placeholder: "When dubbing short 60-second video dramas, I need to..."
    validations:
      required: true

  - type: textarea
    id: expected-benefit
    attributes:
      label: Expected Benefit
      description: How will this benefit other creators and improve overall productivity?
      placeholder: "Saves 5-10 minutes per project by automating..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: "Currently, I export in 16:9 and manually crop using external software..."
    validations:
      required: false